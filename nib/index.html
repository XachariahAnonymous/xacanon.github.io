<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOLCOIN TCG — Solana Trading Card Game</title>
  <link rel="stylesheet" href="css/styles.css?v=lol13">
</head>
<body>
  <div class="flash" id="flash"></div>

  <header class="topbar">
    <div class="logo">LOL<span>COIN</span> TCG</div>
    <nav class="nav">
      <button data-tab="store">Store</button>
      <button data-tab="collection">Collection</button>
      <button data-tab="battle">Battle</button>
      <button data-tab="codex">Codex</button>
      <button data-tab="profile">Profile</button>
    </nav>
    <div class="spacer"></div>
    <div class="row" id="walletArea"></div>
    <a href="admin.html" class="btn ghost sm" style="margin-left:8px">Admin</a>
  </header>

  <main class="wrap" id="main"></main>

  <!-- backend config -->
  <script src="js/firebase-config.js?v=lol13"></script>
  <!-- Firebase SDK (normal tags, not document.write, so it loads reliably) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- shared logic (classic scripts; runs with no build step) -->
  <script src="js/matrix.js?v=lol13"></script>
  <script src="js/catalog.js?v=lol13"></script>
  <script src="js/engine.js?v=lol13"></script>
  <script src="js/battle.js?v=lol13"></script>
  <script src="js/store.js?v=lol13"></script>
  <script src="js/app.js?v=lol13"></script>
  <script>window.NIB.app.init();</script>
</body>
</html>
