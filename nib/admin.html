<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOLCOIN TCG — Admin Panel</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">LOL<span>COIN</span> · Admin</div>
    <nav class="nav hidden" id="tabs">
      <button class="tabbtn" data-tab="overview">Overview</button>
      <button class="tabbtn" data-tab="economy">Economy</button>
      <button class="tabbtn" data-tab="cards">Cards</button>
      <button class="tabbtn" data-tab="onchain">On-Chain</button>
      <button class="tabbtn" data-tab="analytics">Analytics</button>
    </nav>
    <div class="spacer"></div>
    <div class="row" id="walletArea"></div>
    <a href="index.html" class="btn ghost sm" style="margin-left:8px">← Game</a>
  </header>

  <main class="wrap" id="main"></main>

  <script src="js/firebase-config.js?v=lol2"></script>
  <script>
    if (window.NIB_CONFIG && window.NIB_CONFIG.enabled) {
      var _b = "https://www.gstatic.com/firebasejs/10.12.2/";
      ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js", "firebase-storage-compat.js"]
        .forEach(function (f) { document.write('<script src="' + _b + f + '"><\/script>'); });
    }
  </script>

  <script src="js/matrix.js?v=lol2"></script>
  <script src="js/catalog.js?v=lol2"></script>
  <script src="js/engine.js?v=lol2"></script>
  <script src="js/battle.js?v=lol2"></script>
  <script src="js/store.js?v=lol2"></script>
  <script src="js/admin.js?v=lol2"></script>
  <script>window.NIB.admin.init();</script>
</body>
</html>
